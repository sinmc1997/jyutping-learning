<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粵拼打字</title>
<style>
:root{--bg:#f7f7f5;--fg:#222;--card:#fff;--mut:#777;--acc:#2f6fd6;--ok:#2a9d5b;--bad:#d64545;--warn:#e0a52b;--bd:#ddd;--sq1:#f0d9b5;--sq2:#b58863}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#1b1d22;--fg:#eee;--card:#262a31;--mut:#999;--acc:#6ea8ff;--ok:#41c17c;--bad:#ff6b6b;--warn:#f0c060;--bd:#3a3f48} }
:root[data-theme="dark"]{--bg:#1b1d22;--fg:#eee;--card:#262a31;--mut:#999;--acc:#6ea8ff;--ok:#41c17c;--bad:#ff6b6b;--warn:#f0c060;--bd:#3a3f48}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{margin:8px 0 0;font-size:1.6rem}h2{margin:.2em 0}h3{margin:20px 0 8px;font-size:1.1rem}
.sub,.muted{color:var(--mut);font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0;font-size:.95rem}
.progress{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc)}
.mbar{display:inline-block;width:70px;height:8px;background:var(--bd);border-radius:4px;vertical-align:middle;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;font-size:.92rem}
.pill{background:var(--acc);color:#fff;border-radius:999px;padding:2px 10px;font-size:.85rem}
.lnk{color:var(--acc);text-decoration:none;margin-left:auto}
.prompt{font-size:1.08rem;font-weight:600;margin-bottom:8px}
.visual{text-align:center;margin:10px 0}
.big{font-size:clamp(44px,16vw,88px);line-height:1.2}
.timer{font-size:1.4rem;text-align:right;color:var(--warn)}.timer b{font-size:2rem}
.pair{display:flex;justify-content:center;gap:18px;align-items:center;font-size:44px}
.pair .vs{font-size:18px;color:var(--mut)}
.pitch{width:min(260px,80%);height:auto}
.pitch .grid{stroke:var(--bd);stroke-width:1}
.pitch .line{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round}
.pitch .dot{fill:var(--acc)}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(280px,90%);aspect-ratio:1;margin:6px auto;border:2px solid #555}
.sq{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;font-size:clamp(20px,6vw,34px);line-height:1;color:#111}
.sq .rk,.sq .fl{position:absolute;font-size:10px;line-height:1;font-weight:600;opacity:.75}
.sq .rk{top:2px;left:2px}.sq .fl{bottom:2px;right:3px}
.sq.d .rk,.sq.d .fl{color:var(--sq1)}.sq.l .rk,.sq.l .fl{color:var(--sq2)}
.sq.d{background:var(--sq2)}.sq.l{background:var(--sq1)}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.opt.good{border-color:var(--ok);background:rgba(42,157,91,.15)}
.opt.bad{border-color:var(--bad);background:rgba(214,69,69,.15)}
kbd{display:inline-block;min-width:1.4em;text-align:center;border:1px solid var(--bd);border-radius:4px;padding:0 4px;font-size:.8rem;margin-right:4px;color:var(--mut)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row.center{justify-content:center}
.mat{display:inline-block;text-align:left;font-size:1.3rem;line-height:1.8;padding:8px 14px;border:1px solid var(--bd);border-radius:8px}
.guessbox{color:var(--mut);font-size:.92rem}
.okbox,.badbox,.jlbox{border-left:4px solid;border-radius:6px;padding:8px 12px;margin:10px 0}
.okbox{border-color:var(--ok);background:rgba(42,157,91,.1)}
.badbox{border-color:var(--bad);background:rgba(214,69,69,.1)}
.jlbox{border-color:var(--acc);background:rgba(47,111,214,.1)}
.mn{font-weight:600;color:var(--warn)}
details{margin:10px 0}summary{cursor:pointer;color:var(--acc)}
.self{display:block;margin-top:10px;font-size:.92rem}
textarea{display:block;width:100%;margin-top:6px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
.rrow{border-left:4px solid var(--bd);padding:6px 10px;margin:8px 0}
.rrow.good{border-color:var(--ok)}.rrow.bad{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px}
.tile span{color:var(--mut);font-size:.85rem}
.sugg{display:block;width:100%;text-align:left;margin:6px 0;border-left:4px solid var(--acc)}
.path{list-style:none;padding:0}.path li{padding:4px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.ans{width:100%;font-size:1.35rem;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font-family:inherit}
.ans:focus{border-color:var(--acc);outline:none}
code{background:rgba(127,127,127,.15);border-radius:4px;padding:1px 6px;font-size:.95em}
.sent{font-size:2rem;letter-spacing:.08em;margin:6px 0}
.hint{margin:6px auto;max-width:340px;text-align:center}.hint .jp{font-family:ui-monospace,Consolas,monospace;color:var(--mut);margin-top:4px}
.kb{display:inline-flex;flex-direction:column;gap:4px;margin:6px auto;max-width:100%}
.kbrow{display:flex;gap:3px}
.key{min-width:26px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:5px;background:var(--card);font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.key.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.key.wide{padding:0 10px;font-size:.78rem;color:var(--mut)}
.pairbox{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:6px 0}
.pairbox>div{border:1px solid var(--bd);border-radius:10px;padding:8px 14px;min-width:96px;line-height:1.8}
.tt{width:auto;margin:6px auto;border-collapse:collapse}.tt th,.tt td{padding:4px 10px;border:1px solid var(--bd);text-align:center}
.cap{font-size:.9rem;color:var(--mut);margin:6px auto;max-width:520px}
.diagram{border:1px dashed var(--bd);border-radius:12px;padding:10px;margin:12px 0}
.legend{font-size:.8rem;color:var(--mut);margin-top:4px}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin:0 3px 0 8px}
.lg.dot{background:rgba(40,140,70,.8);border-radius:50%}.lg.hit{box-shadow:inset 0 0 0 3px #d64545}.lg.from{box-shadow:inset 0 0 0 3px #2f6fd6}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(40,140,70,.8)}
.sq.hit{box-shadow:inset 0 0 0 3px #d64545}.sq.from{box-shadow:inset 0 0 0 3px #2f6fd6}
.stars{color:#e0a52b;letter-spacing:2px}.bigstars{font-size:2.4rem;color:#e0a52b;letter-spacing:6px;margin:4px 0}
.tile.locked{opacity:.5}
.guide h3{margin-top:18px}.guide li{margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="content.js?v=6"></script>
<script src="engine.js?v=6"></script>
</body>
</html>
